name: Contribution preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c85aaca5f6af534cf1ca806478ee7ca4c73bfb74
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . 'pytest<9' pytest-xdist jsonschema rstr flake8
      - run: python -m flake8 sherlock_project tests --select=E9,F63,F7,F82
      - run: python -m pytest -m 'not online and not validate_targets' -q
