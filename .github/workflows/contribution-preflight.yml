name: Contribution preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PY_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c85aaca5f6af534cf1ca806478ee7ca4c73bfb74
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . 'pytest<9' pytest-xdist jsonschema rstr flake8
      - name: Assert Windows subprocess interpreter matches the test runner
        if: runner.os == 'Windows'
        run: |
          python -c "import sys, subprocess; actual = subprocess.check_output(['py', '-c', 'import sys; print(sys.version_info[:2])'], text=True).strip(); print(actual); assert actual == str(sys.version_info[:2])"
      - run: python -m flake8 sherlock_project tests --select=E9,F63,F7,F82
      - run: python -m pytest -m 'not online and not validate_targets' -q
  python39-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e40a45ec2a074b90703b3b4b842c8a3adbd6ada3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install .
      - name: Confirm existing Python 3.9 import incompatibility
        run: |
          python - <<'PY'
          try:
              import sherlock_project.sites
          except TypeError as exc:
              print(exc)
              assert "unsupported operand type(s) for |" in str(exc)
          else:
              raise AssertionError("Expected original sites.py import limitation")
          PY
