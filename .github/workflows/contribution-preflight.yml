name: Contribution preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d9bc446ba229df6d1295781b757702ca363c2e9
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . 'pytest<9' pytest-xdist jsonschema rstr flake8
      - run: python -m flake8 sherlock_project tests --select=E9,F63,F7,F82
      - run: python -m pytest -m 'not online and not validate_targets' -q
  python39-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e40a45ec2a074b90703b3b4b842c8a3adbd6ada3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install .
      - name: Confirm existing Python 3.9 import incompatibility
        run: |
          python - <<'PY'
          try:
              import sherlock_project.sites
          except TypeError as exc:
              print(exc)
              assert "unsupported operand type(s) for |" in str(exc)
          else:
              raise AssertionError("Expected original sites.py import limitation")
          PY
